org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# BUG reportado por el usuario ("las letras iniciales tienen error, debe ser
# inglés pero aparece 'Loadingâ€¦'"): mojibake clásico de UTF-8 leído como
# Latin-1/Windows-1252 ("…" en bytes UTF-8 es E2 80 A6, que interpretado como
# Windows-1252 se ve exactamente como "â€¦"). El código fuente (.kt) YA está
# correctamente codificado en UTF-8 (verificado byte a byte) — el problema
# ocurre en el TOOLCHAIN DE COMPILACIÓN de quien genera el APK: `file.encoding`
# solo se aplicaba al proceso del Gradle Daemon (org.gradle.jvmargs, arriba),
# pero el COMPILADOR de Kotlin corre en su PROPIO proceso separado (el "Kotlin
# daemon"), que en máquinas cuya configuración regional del sistema operativo
# no sea UTF-8 por defecto (típico en Windows) puede leer los archivos .kt con
# el charset por defecto de la plataforma en vez de UTF-8, corrompiendo
# cualquier carácter no-ASCII (como "…") ya en el binario compilado. FIX:
# forzar explícitamente UTF-8 también en el proceso del Kotlin daemon y como
# propiedad de sistema general del build, para que TODOS los procesos JVM
# involucrados en la compilación (Gradle daemon, Kotlin daemon, workers)
# usen el mismo charset sin importar la configuración regional del sistema.
kotlin.daemon.jvm.options=-Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8
